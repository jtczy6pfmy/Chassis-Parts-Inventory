<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102846"><title>Chassis Parts Inventory</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#f4f6f9;color:#243447;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.app-header{background:#102846;color:#fff;box-shadow:0 3px 12px rgba(16,40,70,.14)}.app-brand{letter-spacing:.1px}.app-subtitle{color:rgba(255,255,255,.68)}.nav-pills{gap:6px}.nav-pills .nav-link{color:rgba(255,255,255,.86);border:1px solid transparent;border-radius:8px;font-weight:500;padding:.48rem .78rem;transition:.15s}.nav-pills .nav-link:hover{color:#fff;background:rgba(255,255,255,.09)}.nav-pills .nav-link.active{background:#fff;color:#102846;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.12)}main{min-height:calc(100vh - 145px)}.metric-card{border:1px solid #e1e6ed;box-shadow:0 2px 10px rgba(16,40,70,.06);border-radius:12px}.metric-value{font-size:1.9rem;font-weight:700;color:#102846}.card h2{color:#102846}.chart{height:220px;display:flex;align-items:end;gap:8px;border-bottom:2px solid #cbd6e2;padding:12px}.chart-col{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end}.chart-bar{background:#1754c0;border-radius:6px 6px 0 0;min-height:5px}.part-thumb{width:54px;height:54px;object-fit:contain;border-radius:8px;background:#f5f7fa;border:1px solid #d8e1ed}.part-detail-image{max-height:300px;max-width:100%;object-fit:contain;border-radius:10px;background:#f5f7fa;border:1px solid #d8e1ed}.image-placeholder{width:54px;height:54px;border-radius:8px;background:#f5f7fa;border:1px dashed #c5d0dd}.image-placeholder-lg{width:100%;height:300px;display:flex;align-items:center;justify-content:center;color:#6c7a89}.stock-good{color:#21723c;font-weight:600}.stock-low{color:#a56500;font-weight:600}.stock-out{color:#c62828;font-weight:700}.table>thead{background:#f7f9fb}.table>thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:#66788a;white-space:nowrap}.table-hover>tbody>tr:hover{background:#f8fbff}.form-control,.form-select{border-color:#d6dee8;border-radius:8px}.btn{border-radius:8px;font-weight:600}.section-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:#718096;font-weight:700}.quick-action{min-height:76px;text-align:left}.quick-action .small{color:#6c7a89}.app-loading{min-height:70vh;display:flex;align-items:center;justify-content:center}@media(max-width:768px){.app-header{position:sticky;top:0;z-index:1000}.nav-pills{flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}.nav-pills .nav-link{white-space:nowrap}.metric-value{font-size:1.55rem}.chart{height:180px;gap:4px}}</style></head><body><main id="root"></main><script src="parts.js"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel" src="src/imageResolver.js"></script><script type="text/babel" src="src/inventoryStore.js"></script><script type="text/babel" src="src/components.jsx"></script><script type="text/babel" src="src/app.jsx"></script></body></html>
