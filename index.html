<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102846">
  <title>Chassis Parts Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#eef3f8;color:#1d2b3a}.app-header{background:#102846;color:#fff}.metric-card{border:0;box-shadow:0 2px 8px rgba(16,40,70,.08)}.metric-value{font-size:1.9rem;font-weight:700}.chart{height:220px;display:flex;align-items:end;gap:8px;border-bottom:2px solid #cbd6e2;padding:12px}.chart-col{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end}.chart-bar{background:#1754c0;border-radius:6px 6px 0 0;min-height:5px}.part-thumb{width:54px;height:54px;object-fit:contain;border-radius:8px;background:#f5f7fa;border:1px solid #d8e1ed}.stock-good{color:#21723c;font-weight:600}.stock-low{color:#a56500;font-weight:600}.stock-out{color:#c62828;font-weight:700}.nav-pills .nav-link{color:#fff}.nav-pills .nav-link.active{background:#fff;color:#102846}
  </style>
</head>
<body>
<header class="app-header py-3"><div class="container-fluid px-3 px-lg-4"><h1 class="h3 mb-1">🚚 Chassis Parts Inventory</h1><div class="small opacity-75">Phase 1 • React + Bootstrap + GitHub</div></div></header>
<main id="root" class="container-fluid px-3 px-lg-4 py-4"></main>
<script src="parts.js"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useMemo,useState}=React;const STORAGE_KEY='cpi-demo-v7';const sourceParts=Array.isArray(window.parts)?window.parts:(typeof parts!=='undefined'&&Array.isArray(parts)?parts:[]);const suppliers=['FleetPride','Parts Authority','Wabash Parts','OEM Supply','Mid-Atlantic Fleet'];const locations=['Harrisburg • Rack A • Bin 04','Harrisburg • Rack B • Bin 12','Warehouse • Shelf C • Bin 07','Parts Room • Rack D • Bin 02'];const nav=[['dashboard','🏠 Dashboard'],['parts','📦 Parts'],['transactions','🔄 Transactions'],['replenish','🛒 Replenish'],['pos','📋 Purchase Orders'],['counts','🔢 Counts'],['reports','📊 Reports'],['alerts','⚠️ Alerts']];
function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved?.catalog?.length)return saved}catch(e){}const catalog=sourceParts.map((p,i)=>({partNumber:p.partNumber||p.PartNumber||p.part||'PART-'+(i+1),description:p.description||p.Description||'Chassis replacement part',image:p.image||p.imagePath||p.image_path||p.imageUrl||p.image_url||'',stock:i%11===0?0:2+(i*7)%48,cost:+(8+(i*13)%115+.95).toFixed(2),supplier:suppliers[i%suppliers.length],location:locations[i%locations.length],usage:Array.from({length:8},(_,w)=>3+(i*5+w*3)%21),min:[10,6,3][i%3],target:[30,18,10][i%3]}));const tx=catalog.slice(0,35).map((p,i)=>({date:new Date(Date.now()-(i+1)*864e5).toISOString(),part:p.partNumber,type:['ISSUE','RECEIVE','ADJUST'][i%3],qty:1+i%9,ref:'DEMO-'+(5600+i)}));return{catalog,tx,pos:[]}}
function saveState(state){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}function status(p){return p.stock<=0?'OUT OF STOCK':p.stock<=p.min?'LOW STOCK':'HEALTHY'}function money(n){return '$'+Number(n||0).toFixed(2)}
function App(){const[view,setView]=useState('dashboard');const[search,setSearch]=useState('');const[state,setState]=useState(loadState);const catalog=state.catalog;const weeks=useMemo(()=>Array.from({length:8},(_,w)=>catalog.reduce((s,p)=>s+(p.usage?.[w]||0),0)),[catalog]);const weekUse=weeks[7]||0,monthUse=weeks.slice(4).reduce((a,b)=>a+b,0),avgUse=Math.round(weeks.reduce((a,b)=>a+b,0)/8)||0,risk=catalog.filter(p=>status(p)!=='HEALTHY').length,invValue=catalog.reduce((s,p)=>s+p.stock*p.cost,0),max=Math.max(...weeks,1),filtered=catalog.filter(p=>(p.partNumber+' '+p.description+' '+p.supplier).toLowerCase().includes(search.toLowerCase())),low=catalog.filter(p=>p.stock<=p.min),top=[...catalog].sort((a,b)=>(b.usage||[]).reduce((x,y)=>x+y,0)-(a.usage||[]).reduce((x,y)=>x+y,0)).slice(0,6);React.useEffect(()=>saveState(state),[state]);function issuePart(partNumber){setState(prev=>({...prev,catalog:prev.catalog.map(p=>p.partNumber===partNumber?{...p,stock:Math.max(0,p.stock-1),usage:p.usage.map((n,i)=>i===7?n+1:n)}:p),tx:[...prev.tx,{date:new Date().toISOString(),part:partNumber,type:'ISSUE',qty:1,ref:'WEB-'+Date.now()}]}))}function receivePart(partNumber,qty){const amount=Math.max(1,Number(qty)||1);setState(prev=>({...prev,catalog:prev.catalog.map(p=>p.partNumber===partNumber?{...p,stock:p.stock+amount}:p),tx:[...prev.tx,{date:new Date().toISOString(),part:partNumber,type:'RECEIVE',qty:amount,ref:'WEB-'+Date.now()}]}))}return <><NavBar view={view} onNavigate={setView}/>{view==='dashboard'&&<Dashboard weekUse={weekUse} monthUse={monthUse} avgUse={avgUse} risk={risk} invValue={invValue} weeks={weeks} max={max} top={top} low={low}/>} {view==='parts'&&<PartsView parts={filtered} search={search} setSearch={setSearch} onIssue={issuePart} onReceive={receivePart}/>} {view==='transactions'&&<TransactionsView tx={state.tx}/>} {view==='replenish'&&<ReplenishView parts={low}/>} {view==='pos'&&<POView pos={state.pos}/>} {view==='counts'&&<CountsView parts={catalog.slice(0,30)}/>} {view==='reports'&&<ReportsView catalog={catalog} value={invValue}/>} {view==='alerts'&&<AlertsView parts={low}/>}</>}
function NavBar({view,onNavigate}){return <ul className="nav nav-pills mt-3 flex-wrap gap-1">{nav.map(([id,label])=><li className="nav-item" key={id}><button className={'nav-link '+(view===id?'active':'')} onClick={()=>{onNavigate(id);window.scrollTo({top:0,behavior:'smooth'})}}>{label}</button></li>)}</ul>}
function Dashboard({weekUse,monthUse,avgUse,risk,invValue,weeks,max,top,low}){return <div className="container-fluid px-0"><div className="row g-3 mb-3">{[['THIS WEEK',weekUse,'parts issued'],['THIS MONTH',monthUse,'parts issued'],['AVG / WEEK',avgUse,'parts'],['STOCK RISK',risk,'need attention'],['INVENTORY VALUE',money(invValue),'']].map(([a,b,c])=><div className="col-6 col-md-4 col-xl" key={a}><div className="card metric-card h-100"><div className="text-muted small">{a}</div><div className="metric-value">{b}</div><div className="small text-muted">{c}</div></div></div>)}</div><div className="card metric-card mb-3"><div className="card-body"><h2 className="h5">📈 Parts Used — Last 8 Weeks</h2><div className="chart">{weeks.map((n,i)=><div className="chart-col" key={i}><div className="chart-bar" style={{height:Math.max(5,n/max*180)+'px'}}></div><small className="text-muted mt-1">W{i+1}</small></div>)}</div></div></div><div className="row g-3"><div className="col-lg-6"><div className="card metric-card h-100"><div className="card-body"><h2 className="h5">🔥 Most Used Parts</h2>{top.map(p=><div className="border rounded p-3 mb-2" key={p.partNumber}><strong>{p.partNumber}</strong><br/><span className="text-muted">{p.description}</span><span className="badge text-bg-light ms-2">{(p.usage||[]).reduce((a,b)=>a+b,0)} used</span></div>)}</div></div></div><div className="col-lg-6"><div className="card metric-card h-100"><div className="card-body"><h2 className="h5">📦 Stock Health</h2>{low.slice(0,8).map(p=><div className="border rounded p-3 mb-2" key={p.partNumber}><strong>{p.partNumber}</strong> — {p.stock} on hand <span className={p.stock<=0?'stock-out':'stock-low'}>{status(p)}</span></div>)}{!low.length&&<div className="alert alert-success">All stock healthy.</div>}</div></div></div></div></div>}
function PartsView({parts,search,setSearch,onIssue,onReceive}){return <div className="card metric-card"><div className="card-body"><div className="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h2 className="h4 mb-0">Parts Catalog</h2><input className="form-control" style={{maxWidth:340}} value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search parts, supplier, description"/></div><div className="table-responsive"><table className="table table-hover align-middle"><thead><tr><th>Image</th><th>Part</th><th>Description</th><th>Supplier</th><th>Location</th><th>On Hand</th><th>Cost</th><th>Actions</th></tr></thead><tbody>{parts.map(p=><tr key={p.partNumber}><td>{p.image?<img className="part-thumb" src={p.image} onError={e=>e.currentTarget.style.display='none'} alt=""/>:<span className="part-thumb d-inline-block"></span>}</td><td><strong>{p.partNumber}</strong></td><td>{p.description}</td><td>{p.supplier}</td><td>{p.location}</td><td className={p.stock<=0?'stock-out':p.stock<=p.min?'stock-low':'stock-good'}>{p.stock}</td><td>{money(p.cost)}</td><td className="text-nowrap"><button className="btn btn-sm btn-primary me-1" onClick={()=>onIssue(p.partNumber)}>Issue</button><button className="btn btn-sm btn-outline-success" onClick={()=>onReceive(p.partNumber,1)}>Receive</button></td></tr>)}</tbody></table></div></div></div>}
function TransactionsView({tx}){return <div className="card metric-card"><div className="card-body"><h2 className="h4">Recent Transactions</h2>{tx.slice().reverse().slice(0,50).map((t,i)=><div className="border rounded p-3 mb-2" key={i}><strong>{t.part}</strong> — {t.type} {t.qty}<br/><small className="text-muted">{new Date(t.date).toLocaleString()} • {t.ref}</small></div>)}</div></div>}
function ReplenishView({parts}){return <div className="card metric-card"><div className="card-body"><h2 className="h4">🛒 Replenishment</h2>{parts.length?parts.map(p=><div className="border rounded p-3 mb-2" key={p.partNumber}><strong>{p.partNumber}</strong> — {p.description}<br/>On hand: <b>{p.stock}</b> • Minimum: {p.min} • Target: {p.target} • Suggested order: <b>{Math.max(0,p.target-p.stock)}</b></div>):<div className="alert alert-success">No replenishment needed.</div>}</div></div>}
function POView({pos}){return <div className="card metric-card"><div className="card-body"><h2 className="h4">📋 Purchase Orders</h2>{pos.length?pos.map((p,i)=><div className="border rounded p-3 mb-2" key={i}>{JSON.stringify(p)}</div>):<div className="alert alert-info">No purchase orders yet. This screen is ready for Phase 2 ordering features.</div>}</div></div>}
function CountsView({parts}){return <div className="card metric-card"><div className="card-body"><h2 className="h4">🔢 Cycle Counts</h2>{parts.map(p=><div className="border rounded p-3 mb-2" key={p.partNumber}><strong>{p.partNumber}</strong> — System quantity {p.stock} • Count required</div>)}</div></div>}
function ReportsView({catalog,value}){return <div className="card metric-card"><div className="card-body"><h2 className="h4">📊 Inventory Reports</h2><div className="row g-3"><div className="col-md-4"><div className="alert alert-primary">Inventory value: <b>{money(value)}</b></div></div><div className="col-md-4"><div className="alert alert-secondary">Total parts: <b>{catalog.length}</b></div></div><div className="col-md-4"><div className="alert alert-warning">Low/out: <b>{catalog.filter(p=>p.stock<=p.min).length}</b></div></div></div></div></div>}
function AlertsView({parts}){return <div className="card metric-card"><div className="card-body"><h2 className="h4">⚠️ Inventory Alerts</h2>{parts.length?parts.map(p=><div className="alert alert-warning" key={p.partNumber}><strong>{p.partNumber}</strong> — {status(p)} — {p.stock} on hand</div>):<div className="alert alert-success">No active alerts.</div>}</div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
